<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Irreferencias — Archivo de Poesía</title>
    <meta name="description" content="Fanzine xeroxeado de poesía: el archivo de irreferencias.blogspot.com en blanco y negro." />

    <!-- PWA -->
    <meta name="theme-color" content="#f4f1e8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-64x64.png" sizes="64x64" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Irreferencias" />
  </head>
  <body>
    <!-- Filtros SVG de degradación xerox: rompen bordes rectos y "revientan"
         el tóner de los titulares grandes hasta parecer fotocopiados. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <defs>
        <filter id="xeroxRough">
          <feTurbulence type="fractalNoise" baseFrequency="0.014 0.02" numOctaves="2" seed="4" result="warp" />
          <feDisplacementMap in="SourceGraphic" in2="warp" scale="3.2" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="xeroxCrush">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="9" result="grain" />
          <feColorMatrix in="grain" type="saturate" values="0" result="mono" />
          <feComponentTransfer in="mono" result="specks">
            <feFuncA type="discrete" tableValues="0 0 0 0 0 0 0 0 1" />
          </feComponentTransfer>
          <feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="2" seed="2" result="warp" />
          <feDisplacementMap in="SourceGraphic" in2="warp" scale="4" xChannelSelector="R" yChannelSelector="G" result="warped" />
          <feComposite in="warped" in2="specks" operator="out" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
